server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: family-tech-translator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:familytech;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  llm:
    provider: ${LLM_PROVIDER:ollama}
    allow-mock-fallback: ${LLM_ALLOW_MOCK_FALLBACK:true}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2:3b}
      connect-timeout-ms: ${OLLAMA_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OLLAMA_READ_TIMEOUT_MS:60000}
