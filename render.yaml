services:
  - type: web
    name: familytech-translator-backend
    env: docker
    dockercontext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_ALLOW_MOCK_FALLBACK
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
